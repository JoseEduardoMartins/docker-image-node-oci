name: Deploy Docker Image OCI

on:
  schedule:
    - cron: '30 22 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/docker-image-node-oci


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Lowercase repo name
          run: |
            echo "IMAGE_NAME_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

        - name: Install cosign
          if: github.event_name != 'pull_request'
          uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
          with:
            cosign-release: 'v2.2.4'

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

        - name: Log into registry ${{ env.REGISTRY }}
          if: github.event_name != 'pull_request'
          uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Bump version and push tag
          id: tag_version
          uses: mathieudutour/github-tag-action@v6.2
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push Docker image
          id: build-and-push
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ghcr.io/${{ env.IMAGE_NAME_LOWER }}:${{ steps.tag_version.outputs.new_tag }}
              ghcr.io/${{ env.IMAGE_NAME_LOWER }}:latest

        - name: Sign the published Docker image
          if: ${{ github.event_name != 'pull_request' }}
          env:
            TAGS: ghcr.io/${{ env.IMAGE_NAME_LOWER }}:latest
            DIGEST: ${{ steps.build-and-push.outputs.digest }}
          run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
